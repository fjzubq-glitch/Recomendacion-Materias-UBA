name: Actualizar datos

on:
  schedule:
    # Domingo 06:00 UTC, cada semana
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # La acción checkout@v4 usaba Node 20 (deprecado) -> v5 usa Node 24
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: pip install pandas openpyxl pypdf gdown

      - name: Descargar y compilar datos (sheets + Drive La Centeno + Franja Morada)
        run: python actualizar_datos.py

      - name: Limpiar y post-procesar (dificultad, dedup, horarios)
        run: node mejorar_datos.js

      - name: Commitear y pushear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpc_data.json cpo_data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; no se committea nada."
            exit 0
          fi
          git commit -m "chore: actualizacion automatica del catalogo"
          git push
